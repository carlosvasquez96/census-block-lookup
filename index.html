<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <h1>Texas Census Block & Block Group Lookup</h1>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Texas Census Block Lookup</h1>

        <p class="description">
            Enter an address to find its Census information.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="address"
                placeholder="Enter an address"
            >

            <button onclick="findCensusBlock()">
                Find Census Information
            </button>

        </div>

        <div id="message"></div>

        <div id="results" class="results">

            <h2>Census Information</h2>

            <p>
                <strong>Matched Address:</strong>
                <span id="matchedAddress"></span>
            </p>

            <p>
    <strong>TEA Census Block Group:</strong>
    <span id="censusBlock"></span>
</p>

<p>
    <strong>Block Group:</strong>
    <span id="blockGroup"></span>
</p>

            <p>
                <strong>Census Tract:</strong>
                <span id="censusTract"></span>
            </p>

            <p>
                <strong>County:</strong>
                <span id="county"></span>
            </p>

            <p>
                <strong>State:</strong>
                <span id="state"></span>
            </p>

        </div>

        </div>

    <p class="data-source">
        Data Source: U.S. Census Bureau — 2020 Census Geography
    </p>

    <script src="script.js"></script>

</body>
</html>
